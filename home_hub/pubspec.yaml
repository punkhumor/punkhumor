name: home_hub
description: 智家 · 可真实控制局域网智能电器（Shelly / Tasmota / ESPHome / Yeelight / Home Assistant）
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  http: ^1.4.0
  uuid: ^4.5.1
  intl: ^0.20.2
  multicast_dns: ^0.3.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: HubSans
      fonts:
        - asset: assets/fonts/DroidSansFallback.ttf
  assets:
    - assets/fonts/DroidSansFallback.ttf
