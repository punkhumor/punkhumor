.scene {

.switch.compact {

.mode-label {

.switch {
  position: relative;
  width: 46px;
  height: 26px;
  flex-shrink: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch-track {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: #3a4654;
  transition: 0.2s ease;
}

.switch-track::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: white;
  top: 3px;
  left: 3px;
  transition: 0.2s ease;
}

.switch input:checked + .switch-track {
  background: var(--design-a);
}

.switch input:checked + .switch-track::after {
  transform: translateX(20px);
}

.tree {
  padding: 8px;
  overflow: auto;
  flex: 1;
}

.tree-node {
  border-radius: 8px;
  margin-bottom: 2px;
}

.tree-row {
  display: grid;
  grid-template-columns: 22px 22px 1fr;
  align-items: center;
  gap: 4px;
  padding: 8px 8px;
  border-radius: 8px;
  user-select: none;
  cursor: pointer;
}

.tree-row:hover {

}

.tree-row.parent.active {
  background: color-mix(in srgb, var(--design-a) 18%, transparent);
}

.tree-row.parent.b-active {
  background: color-mix(in srgb, var(--design-b) 18%, transparent);
}

.twist {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  color: var(--text-muted);
  border-radius: 6px;
}

.twist:hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
}

.twist svg {
  width: 12px;
  height: 12px;
  transition: transform 0.18s ease;
}

.twist[aria-expanded="true"] svg {
  transform: rotate(90deg);
}

.checkbox {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1.5px solid rgba(232, 238, 245, 0.45);
  display: grid;
  place-items: center;
  background: transparent;
  transition: 0.15s ease;
}

.checkbox.on {
  background: var(--accent);
  border-color: var(--accent);
}

.checkbox.on.a {
  background: var(--design-a);
  border-color: var(--design-a);
}

.checkbox.partial {
  background: color-mix(in srgb, var(--design-a) 45%, transparent);
  border-color: var(--design-a);
}

.checkbox.partial.b,
.checkbox.on.b {
  background: var(--design-b);
  border-color: var(--design-b);
}

.checkbox.partial.b {
  background: color-mix(in srgb, var(--design-b) 45%, transparent);
}

.checkbox svg {
  width: 12px;
  height: 12px;
  opacity: 0;
}

.checkbox.on svg,
.checkbox.partial svg {
  opacity: 1;
}

.tree-label {
  font-size: 0.92rem;
}

.dim-tag {
  font-size: 0.72rem;
  color: var(--text-muted);

}

.dim-tag.on {

}

.tree-children {

}

.scene-wrap {

}

.scene {

    radial-gradient(circle at 70% 70%, rgba(74, 163, 232, 0.07), transparent 35%),

.scene-legend {

.person {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--marker-dim);
  border: 2px solid var(--marker);
  color: #1a1508;
  font-weight: 700;
  font-size: 0.72rem;
  transition:
    opacity 0.28s ease,
    transform 0.28s ease,
    filter 0.28s ease,
    box-shadow 0.28s ease;
  box-shadow: 0 0 0 0 transparent;
  cursor: default;
}

.person .dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(160deg, #ffe08a, #e2a93a);
  display: grid;
  place-items: center;
  box-shadow: inset 0 -2px 6px rgba(0, 0, 0, 0.15);
}

.person.hidden-person {
  opacity: 0.12;
  filter: grayscale(1);
  transform: translate(-50%, -50%) scale(0.86);
  pointer-events: none;
}

.person.visible-person {
  opacity: 1;
  box-shadow: 0 0 0 6px rgba(240, 193, 74, 0.12);
}

.person-tip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%) translateY(4px);
  min-width: 160px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(12, 16, 20, 0.95);
  border: 1px solid var(--line);
  color: var(--text);

/** Leaf nodes under a node (node itself if it has no children). */
function leafNodes(node) {
  if (!node.children?.length) return [node];
  return node.children.flatMap(leafNodes);
}

function leafIdsUnder(node) {
  return leafNodes(node).map((n) => n.id);
}

function allLeafIds(categories = CATEGORIES) {
  return categories.flatMap((cat) => leafIdsUnder(cat));
}

/** Every selectable id → meta (leaves + intermediate groups for labeling). */
const ATTR_META = {};
for (const cat of CATEGORIES) {
  ATTR_META[cat.id] = {
    categoryId: cat.id,
    categoryLabel: cat.label,
    label: cat.label,
    level: 1,
  };
  for (const child of cat.children) {
    ATTR_META[child.id] = {
      categoryId: cat.id,
      categoryLabel: cat.label,
      label: child.label,
      level: 2,
    };
    if (child.children?.length) {
      for (const g of child.children) {
        ATTR_META[g.id] = {
          categoryId: cat.id,
          categoryLabel: cat.label,
          label: g.label,
          level: 3,
          parentId: child.id,
        };
      }
    }
  }
}

function labelForAttr(id) {

}

function attrsInCategory(person, categoryId) {
  return person.attrs.filter((id) => ATTR_META[id]?.categoryId === categoryId);
}

/** Marker color: prefer department, then identity, then position, then work. */
function colorForPerson(person) {
  const order = ["department", "identity", "position", "workType"];
  for (const catId of order) {
    if (attrsInCategory(person, catId).length) return CATEGORY_COLORS[catId];
  }
  return "#8b9aab";
}


function asSet(selectedIds) {
  return selectedIds instanceof Set ? selectedIds : new Set(selectedIds);
}

function isAllSelected(selected, universe) {
  return (
    selected.size >= universe.length && universe.every((id) => selected.has(id))
  );
}

/**
 * Smart AND constraints for 同时命中 / Design B:
 * - 某大类叶子全选 → 约束为「属于该大类」(有该类任一叶子即可)
 * - 某二级分组全选 → 约束为「属于该分组」
 * - 未全选的子类叶子 → 每个叶子单独作为必须命中的 tag（AND）
 * - 所有约束之间 AND
 */
function buildSmartConstraints(
  selectedIds,
  categories = DEFAULT_CATEGORIES
) {
  const selected = asSet(selectedIds);
  const constraints = [];
  const cats = categories || DEFAULT_CATEGORIES;

  for (const cat of cats) {
    const catLeaves = leafIdsUnder(cat);
    const selInCat = catLeaves.filter((id) => selected.has(id));
    if (selInCat.length === 0) continue;

    if (selInCat.length === catLeaves.length) {
      constraints.push({ type: "any", ids: catLeaves, label: cat.label });
      continue;
    }

    for (const child of cat.children) {
      const leaves = leafIdsUnder(child);
      const selMid = leaves.filter((id) => selected.has(id));
      if (selMid.length === 0) continue;

      if (child.children?.length) {
        if (selMid.length === leaves.length) {
          constraints.push({ type: "any", ids: leaves, label: child.label });
        } else {
          for (const id of selMid) {
            constraints.push({
              type: "has",
              id,
              label: ATTR_META[id]?.label || id,
            });
          }
        }
      } else {
        constraints.push({
          type: "has",
          id: child.id,
          label: child.label,
        });
      }
    }
  }

  return constraints;
}

function matchSmartConstraints(person, constraints) {
  return constraints.every((c) => {
    if (c.type === "any") return c.ids.some((id) => person.attrs.includes(id));
    if (c.type === "has") return person.attrs.includes(c.id);
    return false;
  });
}

/**
 * Design A (带模式)
 * - multi  多选显示: OR
 * - filter 匹配显示: smart AND（大类全选按大类，子类未全选按叶子 AND）
 */
function filterDesignA(
  people,
  selectedIds,
  mode,
  leafUniverse,
  categories = DEFAULT_CATEGORIES
) {
  const universe = leafUniverse || allLeafIds();
  const selected = asSet(selectedIds);

  if (selected.size === 0) return [];
  if (isAllSelected(selected, universe)) return people.map((p) => p.id);

  if (mode === "multi") {
    return people
      .filter((p) => p.attrs.some((id) => selected.has(id)))
      .map((p) => p.id);
  }

  const constraints = buildSmartConstraints(selected, categories);
  if (constraints.length === 0) return [];
  return people
    .filter((p) => matchSmartConstraints(p, constraints))
    .map((p) => p.id);
}

/**
 * Design B：始终 smart AND（类内全选按类，未全选叶子 AND，类间 AND）
 */
function filterDesignB(
  people,
  selectedIds,
  leafUniverse,
  categories = DEFAULT_CATEGORIES
) {
  const universe = leafUniverse || allLeafIds();
  const selected = asSet(selectedIds);

  if (selected.size === 0) return [];
  if (isAllSelected(selected, universe)) return people.map((p) => p.id);

  const constraints = buildSmartConstraints(selected, categories);
  if (constraints.length === 0) return [];
  return people
    .filter((p) => matchSmartConstraints(p, constraints))
    .map((p) => p.id);
}

function initialDesignAState(categories = DEFAULT_CATEGORIES) {
  const leaves = allLeafIds(categories);
  const expanded = {};
  for (const cat of categories) {
    expanded[cat.id] = cat.id === "department";
    for (const child of cat.children) {
      if (child.children?.length) expanded[child.id] = false;
    }
  }
  return {
    mode: "multi",
    selected: new Set(leaves),
    expanded,
  };
}

function initialDesignBState(categories = DEFAULT_CATEGORIES) {
  const leaves = allLeafIds(categories);
  const expanded = {};
  for (const cat of categories) {
    expanded[cat.id] = cat.id === "department";
    for (const child of cat.children) {
      if (child.children?.length) expanded[child.id] = false;
    }
  }
  return {
    selected: new Set(leaves),
    expanded,
  };
}

function nodeCheckState(node, selectedIds) {
  const leaves = leafIdsUnder(node);
  if (leaves.length === 0) return "none";
  const selected = asSet(selectedIds);
  const n = leaves.filter((id) => selected.has(id)).length;
  if (n === 0) return "none";
  if (n === leaves.length) return "all";
  return "partial";
}

function parentCheckState(category, selectedIds) {
  return nodeCheckState(category, selectedIds);
}

function clearAllLeaves() {
  return new Set();
}

function selectAllLeaves(categories = DEFAULT_CATEGORIES) {
  return new Set(allLeafIds(categories));
}

  for (const id of leafIds) {

  const allOn = leafIds.every((id) => selected.has(id));

/** Switch row: looks like it drives how list checks are interpreted */
function renderModeToggle(eng, scope) {

}

function renderTree(eng, scope, accent) {
  return CATEGORIES.map((cat) => {
    const catExpanded = !!eng.expanded[cat.id];
    const pState = nodeCheckState(cat, eng.selected);
    const checkClass =
      pState === "all" ? `on ${accent}` : pState === "partial" ? `partial ${accent}` : "";
    const color = CATEGORY_COLORS[cat.id];

    const level2 = cat.children
      .map((child) => {
        const hasKids = !!child.children?.length;
        const midExpanded = !!eng.expanded[child.id];
        const cState = nodeCheckState(child, eng.selected);
        const cClass =
          cState === "all"
            ? `on ${accent}`
            : cState === "partial"
              ? `partial ${accent}`
              : "";

        const level3 = hasKids
          ? child.children
              .map((g) => {
                const on = eng.selected.has(g.id);
                return `<div class="tree-node">
                  <div class="tree-row child lv3" data-scope="${scope}" data-act="sel-leaf" data-id="${g.id}">
                    <span></span>
                    <span class="checkbox ${on ? `on ${accent}` : ""}">${checkIcon()}</span>
                    <span class="tree-label">${g.label}</span>
                  </div>
                </div>`;
              })
              .join("")
          : "";

        return `<div class="tree-node">
          <div class="tree-row child lv2" data-scope="${scope}" data-act="${
            hasKids ? "sel-group" : "sel-leaf"
          }" data-id="${child.id}">
            ${
              hasKids
                ? `<button class="twist" type="button" aria-expanded="${midExpanded}" data-scope="${scope}" data-act="expand" data-id="${child.id}">${twistIcon()}</button>`
                : `<span></span>`
            }
            <span class="checkbox ${cClass}" data-scope="${scope}" data-act="${
              hasKids ? "sel-group" : "sel-leaf"
            }" data-id="${child.id}">${checkIcon(cState === "partial")}</span>
            <span class="tree-label">${child.label}</span>
          </div>
          ${
            hasKids
              ? `<div class="tree-children ${midExpanded ? "" : "hidden"}">${level3}</div>`
              : ""
          }
        </div>`;
      })
      .join("");

    return `<div class="tree-node">
      <div class="tree-row parent" style="--cat-color:${color}" data-scope="${scope}" data-act="sel-group" data-id="${cat.id}">
        <button class="twist" type="button" aria-expanded="${catExpanded}" data-scope="${scope}" data-act="expand" data-id="${cat.id}">${twistIcon()}</button>
        <button type="button" class="checkbox ${checkClass}" data-scope="${scope}" data-act="sel-group" data-id="${cat.id}">${checkIcon(
          pState === "partial"
        )}</button>
        <span class="tree-label"><span class="cat-dot" style="background:${color}"></span>${cat.label}</span>
      </div>
      <div class="tree-children ${catExpanded ? "" : "hidden"}">${level2}</div>
    </div>`;
  }).join("");
}

function renderPeople(visible) {
  return PEOPLE.map((person) => {
    const isVisible = visible.has(person.id);
    const color = colorForPerson(person);
    const attrs =
      person.attrs.length === 0
        ? "未绑定分类"
        : person.attrs.map(labelForAttr).join(" · ");
    return `<div class="person ${isVisible ? "visible-person" : "hidden-person"}" style="left:${person.x}%;top:${person.y}%">
      <div class="dot" style="background:linear-gradient(160deg, color-mix(in srgb, ${color} 80%, white), ${color})">${person.name.slice(0, 1)}</div>
      <div class="person-tip"><strong>${person.name}</strong><br>${attrs}</div>
    </div>`;
  }).join("");
}

function renderRoster(visible) {
  return `<div class="roster">
    <div class="roster-head">人员对照 <span>${visible.size}/${PEOPLE.length}</span></div>
    <div class="roster-list">
      ${PEOPLE.map((p) => {
        const on = visible.has(p.id);
        const color = colorForPerson(p);
        const attrs =
          p.attrs.length === 0
            ? "未绑定"
            : p.attrs.map(labelForAttr).join(" · ");
        return `<div class="roster-row ${on ? "on" : "off"}">
          <i style="background:${color}"></i>
          <div>
            <strong>${p.name}</strong>
            <p>${attrs}</p>
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function renderGoalsSide() {
  return `<div class="side-goals">
    <div class="roster-head">小目标</div>
    ${GOALS.map(
      (g, i) => `<div class="side-goal"><b>${i + 1}. ${g.title}</b><span>${g.tip}</span></div>`
    ).join("")}
  </div>`;
}

function legendHtml() {
  return Object.entries(CATEGORY_COLORS)
    .map(([id, color]) => {
      const label = CATEGORIES.find((c) => c.id === id)?.label || id;
      return `<span class="legend-item"><i style="background:${color}"></i>${label}</span>`;
    })
    .join("");
}

function renderPanel(label, opts = {}) {
  const key = engineKeyForLabel(label);
  const eng =
    opts.engine || (key === "toggle" ? state.toggle : state.facet);
  const scope = opts.scope || `solo-${label}`;
  const visible = visibleFor(label, eng);
  const isToggle = key === "toggle";
  const badgeClass = label === "A" ? "a" : "b";
  const accent = isToggle ? "a" : "b";
  const compact = !!opts.compact;

  return `<div class="workspace panel ${compact ? "compact" : ""}" data-panel="${label}">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="design-badge ${badgeClass}">方案 ${label}</div>
        <h3>筛选面板</h3>
      </div>
      <div class="sidebar-body">
        ${isToggle ? renderModeToggle(eng, scope) : ""}
        <div class="tree">${renderTree(eng, scope, accent)}</div>
      </div>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" type="button" data-scope="${scope}" data-act="reset-on">重置全选</button>
        <button class="btn btn-ghost btn-sm" type="button" data-scope="${scope}" data-act="reset-off">重置全关</button>
      </div>
    </aside>
    <section class="scene-wrap">
      <div class="scene">
        ${renderPeople(visible)}
        <div class="scene-legend">
          <div>亮=显示 · 暗=隐藏 · ${visible.size}/${PEOPLE.length}</div>
          <div class="legend-row">${legendHtml()}</div>
        </div>
      </div>
    </section>
    ${
      compact
        ? ""
        : `<aside class="side-rail">
      ${renderGoalsSide()}
      ${renderRoster(visible)}
    </aside>`
    }
  </div>`;
}

function ensureCompareEngines() {
  if (!state.compare.A) {
    const keyA = engineKeyForLabel("A");
    state.compare.A = cloneEngine(
      keyA === "toggle" ? state.toggle : state.facet
    );
  }
  if (!state.compare.B) {
    const keyB = engineKeyForLabel("B");
    state.compare.B = cloneEngine(
      keyB === "toggle" ? state.toggle : state.facet
    );
  }
}

function engineByScope(scope) {
  if (scope === "solo-A" || scope === "solo-B") {
    const label = scope.slice(-1);
    const key = engineKeyForLabel(label);
    return {
      key,
      eng: key === "toggle" ? state.toggle : state.facet,
      label,
      compare: false,
    };
  }
  if (scope === "cmp-A" || scope === "cmp-B") {
    ensureCompareEngines();
    const label = scope.slice(-1);
    const key = engineKeyForLabel(label);
    return { key, eng: state.compare[label], label, compare: true };
  }
  return null;
}

function findNode(id) {
  for (const cat of CATEGORIES) {
    if (cat.id === id) return cat;
    for (const child of cat.children) {
      if (child.id === id) return child;
      const g = child.children?.find((x) => x.id === id);
      if (g) return g;
    }
  }
  return null;
}

function handleAct(act, scope, dataset) {
  const ctx = engineByScope(scope);
  if (!ctx) return false;
  const { key, eng } = ctx;

  if (act === "expand") {
    eng.expanded[dataset.id] = !eng.expanded[dataset.id];
    return true;
  }
  if (act === "sel-group") {
    const node = findNode(dataset.id);
    if (!node) return false;
    toggleLeaves(eng.selected, leafIdsUnder(node));
    return true;
  }
  if (act === "sel-leaf") {
    const id = dataset.id;
    if (eng.selected.has(id)) eng.selected.delete(id);
    else eng.selected.add(id);
    return true;
  }
  if (act === "t-mode-set") {
    if (key !== "toggle") return false;
    eng.mode = dataset.mode === "filter" ? "filter" : "multi";
    return true;
  }
  if (act === "t-mode-check") {
    if (key !== "toggle") return false;
    eng.mode = dataset.checked ? "filter" : "multi";
    return true;
  }
  if (act === "reset-on") {
    if (ctx.compare) {
      const next =
        key === "toggle"
          ? initialDesignAState(CATEGORIES)
          : initialDesignBState(CATEGORIES);
      next.mode = eng.mode;
      state.compare[ctx.label] = next;
    } else {
      const mode = eng.mode;
      resetEngine(key, false);
      if (key === "toggle") state.toggle.mode = mode;
    }
    return true;
  }
  if (act === "reset-off") {
    if (ctx.compare) {
      eng.selected = clearAllLeaves(CATEGORIES);
    } else {
      const mode = eng.mode;
      resetEngine(key, true);
      if (key === "toggle") state.toggle.mode = mode;
    }
    return true;
  }
  return false;
}

function getVotes() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch {
    return [];
  }
}

function addVote(vote) {
  const votes = getVotes();
  votes.push(vote);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
}

function renderNav() {
  const ab =
    session.first === "A"
      ? [
          { id: "A", label: "方案 A" },
          { id: "B", label: "方案 B" },
        ]
      : [
          { id: "B", label: "方案 B" },
          { id: "A", label: "方案 A" },
        ];
  const items = [
    { id: "intro", label: "说明" },
    ...ab,
    { id: "compare", label: "并排对比" },
    { id: "vote", label: "投票" },
    { id: "results", label: "汇总" },
  ];
  document.getElementById("nav").innerHTML = items
    .map(
      (it) =>
        `<button type="button" class="nav-pill ${
          state.view === it.id ? "active" : ""
        }" data-act="nav" data-view="${it.id}">${it.label}</button>`
    )
    .join("");
}

function renderIntro() {
  const goals = GOALS.map(
    (g, i) => `<div class="goal-card">
      <div class="goal-idx">${i + 1}</div>
      <div>
        <strong>${g.title}</strong>
        <p>${g.tip}</p>
      </div>
    </div>`
  ).join("");

  return `<section class="panel panel-pad intro-fit">
    <div class="hero-copy">
      <h2>显隐筛选交互对比</h2>
      <p class="lead">
        用左侧勾选控制地图人员显隐。两套方案名称已随机对应，试用后到「投票」选一个即可。
      </p>
    </div>
    <div class="goal-list goal-grid">${goals}</div>
    <div class="tag-row">
      <span class="tag">默认全选</span>
      <span class="tag">可随时跳转</span>
      <span class="tag">每次随机先后</span>
    </div>
  </section>`;
}

function renderVote() {
  return `<section class="panel panel-pad vote-simple">
    <h2 class="section-title">投给谁？</h2>
    <p class="lead">选一个更顺手的方案。</p>
    <form class="vote-form" id="vote-form">
      <div class="choice-group vote-big">
        <label class="choice vote-choice">
          <input type="radio" name="prefer" value="A" required />
          <span>方案 A</span>
        </label>
        <label class="choice vote-choice">
          <input type="radio" name="prefer" value="B" />
          <span>方案 B</span>
        </label>
      </div>
      <div class="btn-row" style="margin-top:18px">
        <button class="btn btn-primary" type="submit">提交</button>
      </div>
    </form>
  </section>`;
}

function renderResults() {
  const votes = getVotes();
  const preferA = votes.filter((v) => v.prefer === "A").length;
  const preferB = votes.filter((v) => v.prefer === "B").length;
  const list = votes.length
    ? votes
        .slice()
        .reverse()
        .map(
          (v) => `<div class="result-card">
          <div><strong>投给方案 ${v.prefer}</strong> · ${new Date(
            v.at
          ).toLocaleString()}</div>
        </div>`
        )
        .join("")
    : `<p class="lead">还没有本机投票。</p>`;

  return `<section class="panel panel-pad">
    <h2 class="section-title">本机汇总</h2>
    <div class="compare-grid">
      <div class="compare-card"><h3>方案 A</h3><p><strong>${preferA}</strong> 票</p></div>
      <div class="compare-card"><h3>方案 B</h3><p><strong>${preferB}</strong> 票</p></div>
    </div>
    <div class="results-list" style="margin-top:16px">${list}</div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-secondary" type="button" data-act="export">导出 JSON</button>
      <button class="btn btn-ghost" type="button" data-act="clear-votes">清除本机记录</button>
    </div>
  </section>`;
}

function paint() {
  renderNav();
  const main = document.getElementById("main");
  if (state.view === "intro") main.innerHTML = renderIntro();
  else if (state.view === "A") main.innerHTML = renderPanel("A", { scope: "solo-A" });
  else if (state.view === "B") main.innerHTML = renderPanel("B", { scope: "solo-B" });
  else if (state.view === "compare") {
    ensureCompareEngines();
    main.innerHTML = `<div class="compare-workspaces">
      ${renderPanel("A", { scope: "cmp-A", engine: state.compare.A, compact: true })}
      ${renderPanel("B", { scope: "cmp-B", engine: state.compare.B, compact: true })}
    </div>`;
  } else if (state.view === "vote") main.innerHTML = renderVote();
  else if (state.view === "results") main.innerHTML = renderResults();
}

async function submitVote(form) {
  const fd = new FormData(form);
  const prefer = fd.get("prefer");
  if (!prefer) return;
  const vote = {
    prefer,
    map: state.map,
    first: session.first,
    at: Date.now(),
  };
  addVote(vote);

  const text = `【显隐筛选投票】投给方案 ${vote.prefer}
映射: A=${vote.map.A}, B=${vote.map.B}
时间: ${new Date(vote.at).toLocaleString()}`;

  let emailed = false;
  if (location.protocol !== "file:") {
    try {
      const res = await fetch(`https://formsubmit.co/ajax/${OWNER_EMAIL}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          prefer: vote.prefer,
          map: JSON.stringify(vote.map),
          first: vote.first,
          at: new Date(vote.at).toISOString(),
          _subject: `[显隐筛选] 投给方案${vote.prefer}`,
          _template: "table",
        }),
      });
      if (!res.ok) throw new Error("fail");
      emailed = true;
      showToast("已提交");
    } catch {
      emailed = false;
    }
  }
  if (!emailed) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      /* ignore */
    }
    const a = document.createElement("a");
    a.href = `mailto:${OWNER_EMAIL}?subject=${encodeURIComponent(
      `[显隐筛选] 投给方案${vote.prefer}`
    )}&body=${encodeURIComponent(text)}`;
    a.click();
    showToast("已复制并打开邮件");
  }
  state.view = "results";
  paint();
}

function wire() {
  const root = document.getElementById("app");

  root.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-act='nav']");
    if (nav) {
      state.view = nav.dataset.view;
      paint();
      return;
    }

    if (e.target.closest("[data-act='export']")) {
      const blob = new Blob([JSON.stringify(getVotes(), null, 2)], {
        type: "application/json",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `filter-votes-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      return;
    }

    if (e.target.closest("[data-act='clear-votes']")) {
      if (confirm("清除本机投票？")) {
        localStorage.removeItem(STORAGE_KEY);
        paint();
      }
      return;
    }

    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "nav" || act === "t-mode-check") return;
    const scope = el.dataset.scope;
    if (!scope) return;
    if (handleAct(act, scope, el.dataset)) {
      e.preventDefault();
      paint();
    }
  });

  root.addEventListener("change", (e) => {
    const el = e.target.closest("[data-act='t-mode-check']");
    if (!el) return;
    handleAct("t-mode-check", el.dataset.scope, {
      checked: e.target.checked,
    });
    paint();
  });

  root.addEventListener("submit", (e) => {
    if (e.target.id !== "vote-form") return;
    e.preventDefault();
    submitVote(e.target);
  });
}

wire();
paint();

</script>
</body>
</html>
